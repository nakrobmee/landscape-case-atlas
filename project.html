<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="assets/style.css?v=14">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data/projects.js"></script>
<script src="assets/common.js?v=11"></script>
<style>
.topbar{position:sticky;top:0;z-index:1000;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .in{max-width:1600px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;font-size:14px}
.topbar .t{color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1;min-width:0;border-left:1px solid var(--line);padding-left:16px}
@media (max-width:640px){.topbar .t,.brand>span:last-child{display:none}.topbar .in{justify-content:space-between}}
.wrap{max-width:1600px;margin:0 auto;padding:0 16px}
h1,h2{font-family:Poppins,Anuphan,system-ui,sans-serif;font-weight:700;letter-spacing:-.015em}

/* hero: crossfading slideshow of the project photos (drawings excluded) */
.hero{position:relative;height:min(78vh,780px);background:#1e1f20;overflow:hidden}
/* prev / next: invisible left & right halves with an arrow cursor (same as the Refield Lab hero) */
.hero-nav{position:absolute;top:0;bottom:0;z-index:1;width:50%;border:0;background:none;padding:0}
.hero-nav--prev{left:0;cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 512 512'><path fill='white' stroke='black' stroke-opacity='.35' stroke-width='14' d='M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.3 288 480 288c17.7 0 32-14.3 32-32s-14.3-32-32-32l-370.7 0 105.4-105.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z'/></svg>") 12 12,w-resize}
.hero-nav--next{right:0;cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 512 512'><path fill='white' stroke='black' stroke-opacity='.35' stroke-width='14' d='M502.6 278.6c12.5-12.5 12.5-32.8 0-45.3l-160-160c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L402.7 224 32 224c-17.7 0-32 14.3-32 32s14.3 32 32 32l370.7 0-105.4 105.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0l160-160z'/></svg>") 12 12,e-resize}
.hero-nav:focus-visible{outline:2px solid rgba(255,255,255,.8);outline-offset:-4px}
/* screen edges of the hero: hover → card for the previous / next project, click → go there */
.edge{position:absolute;top:0;bottom:0;width:64px;z-index:3;display:block;text-decoration:none;color:var(--ink)}
.edge--prev{left:0;background:linear-gradient(to right,rgba(0,0,0,.35),transparent);opacity:.0;transition:opacity .25s}
.edge--next{right:0;background:linear-gradient(to left,rgba(0,0,0,.35),transparent);opacity:.0;transition:opacity .25s}
.edge:hover,.edge:focus-visible{opacity:1}
.edge-card{position:absolute;top:50%;display:flex;align-items:center;gap:12px;width:280px;padding:8px 14px 8px 8px;border-radius:12px;
  background:var(--surface);box-shadow:0 8px 28px rgba(0,0,0,.35);opacity:0;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .25s;pointer-events:none}
.edge--prev .edge-card{left:16px;transform:translate(-24px,-50%)}
.edge--next .edge-card{right:16px;transform:translate(24px,-50%);flex-direction:row-reverse;text-align:right;padding:8px 8px 8px 14px}
.edge:hover .edge-card,.edge:focus-visible .edge-card{opacity:1;transform:translate(0,-50%)}
.edge-card img,.edge-card .ph{width:64px;height:80px;border-radius:8px;object-fit:cover;flex:none;background:var(--accent-soft)}
.edge-card small{display:block;font-size:11.5px;color:var(--muted);margin-bottom:2px}
.edge-card b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14.5px;line-height:1.3}
.edge-card em{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:2px}
@media (hover:none){.edge{display:none}}
.hero .sl{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;transition:opacity .9s ease;transform:scale(1.03)}
.hero .sl.on{opacity:1;animation:kb 6s ease-out forwards}
@keyframes kb{from{transform:scale(1.03)}to{transform:scale(1.09)}}
@media (prefers-reduced-motion:reduce){.hero .sl.on{animation:none}.hero .sl{transition:none}}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:30%;background:linear-gradient(to top,rgba(0,0,0,.55),transparent);pointer-events:none}
.hero .dots{position:absolute;z-index:2;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:6px}
.hero .dots button{width:8px;height:8px;border-radius:50%;border:none;padding:0;background:rgba(255,255,255,.45);cursor:pointer;transition:width .3s,background .3s}
.hero .dots button[aria-current=true]{width:22px;border-radius:4px;background:#fff}
.hero .hcap{position:absolute;z-index:2;right:16px;bottom:14px;color:rgba(255,255,255,.8);font-size:11.5px;max-width:45%;text-align:right;text-shadow:0 1px 3px rgba(0,0,0,.6);pointer-events:none}

.intro{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,1fr);gap:40px;align-items:start;padding:32px 0 0}
.head{min-width:0}
h1{font-size:clamp(32px,5vw,56px);line-height:1.08;margin:10px 0 4px}
.sub{color:var(--muted);font-size:15px}
.lead{font-size:clamp(17px,1.6vw,20px);line-height:1.6;font-weight:500;margin:14px 0 0;max-width:820px}
.mapbtn{display:inline-block;font-size:13.5px;font-weight:600;text-decoration:none;margin-top:12px}
/* project facts: one card, label | value rows with dividers (no gaps however long a value is) */
.facts{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 20px;margin-top:6px}
.facts div{display:grid;grid-template-columns:116px minmax(0,1fr);gap:14px;padding:13px 0;font-size:14.5px;font-weight:500;line-height:1.5}
.facts div+div{border-top:1px solid var(--line)}
.facts p{margin:0}
.facts span{color:var(--muted);font-size:12.5px;font-weight:400;padding-top:2px}
@media (max-width:420px){.facts div{grid-template-columns:1fr;gap:2px}}

/* photo gallery: masonry columns, caption appears on hover */
.photos{columns:4 260px;column-gap:12px;margin-top:40px}
.photos figure{margin:0 0 12px;break-inside:avoid;position:relative;border-radius:10px;overflow:hidden;background:var(--accent-soft)}
.photos img{width:100%;display:block;cursor:zoom-in;transition:transform .5s}
.photos figure:hover img{transform:scale(1.03)}
.photos figcaption{position:absolute;inset:auto 0 0 0;margin:0;padding:28px 12px 10px;color:#fff;font-size:12px;background:linear-gradient(to top,rgba(0,0,0,.75),transparent);opacity:0;transition:opacity .25s;pointer-events:none}
.photos figure:hover figcaption{opacity:1}
.photos figcaption a{color:#fff;pointer-events:auto}
.photos.collapsed figure.more{display:none}
.morebtn{display:block;margin:6px auto 0;background:var(--surface);color:var(--accent-text);border:1px solid var(--line)}

section{margin:56px 0}
h2{font-size:24px;margin:0 0 14px;display:flex;align-items:baseline;gap:10px}
h2 small{font-weight:400;font-size:13px;color:var(--muted)}
/* asymmetric: narrow reading column, wide drawings (5:7); without drawings the text leads (7:4) */
.cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:56px;align-items:start}
.cols.nodraw{grid-template-columns:minmax(0,7fr) minmax(0,4fr)}
.desc p{margin:0 0 16px;font-size:16px;line-height:1.75}
.strat{margin-top:24px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:16px 20px}
.strat h3{margin:0 0 10px;font-size:16px}
.strat ul{margin:0;padding-left:20px}.strat li{margin-bottom:7px;font-size:15px;line-height:1.55}
.strat li::marker{color:var(--accent-text)}
.sub-sec{margin-top:40px}
.side{position:sticky;top:76px}
.side .strat{margin-top:0}
.sub-sec h2{font-size:20px}
.tags{font-size:13px;color:var(--muted);margin-top:16px}
/* drawings: boxes stacked beside the description */
.drawings{display:grid;gap:14px}
.drawings figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.drawings img{width:100%;max-height:80vh;object-fit:contain;display:block;cursor:zoom-in;background:#fff;border-radius:6px}
.drawings figcaption{font-size:12.5px;color:var(--muted);margin-top:8px}
.ttag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:4px;background:var(--accent);color:#fff;margin-right:6px}

#locmap{height:420px;border-radius:12px;border:1px solid var(--line)}
.mapnote{font-size:12.5px;color:var(--muted);margin-top:6px}
.narrow{max-width:980px}
.research li,.sources li{margin-bottom:10px}
.research .note{display:block;color:var(--muted);font-size:13.5px}
.updlog{list-style:none;padding:0;margin:0}.updlog li{font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}.updlog time{color:var(--muted);font-size:12.5px;margin-right:8px}
.nav{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:20px 0 48px;font-size:14px}
.nav a{text-decoration:none;max-width:45%}
.notfound{padding:80px 16px;text-align:center}
@media (max-width:900px){.cols,.intro{grid-template-columns:1fr;gap:28px}}
@media (max-width:640px){.hero{height:56vh}.facts div{flex-basis:50%;border-left:none!important;padding-left:0!important}#locmap{height:300px}.photos{columns:2 150px;column-gap:8px}.photos figure{margin-bottom:8px}}
</style>
</head>
<body>
<div class="topbar"><div class="in"><span id="brand"></span><span class="t" id="crumb"></span><span id="nav"></span></div></div>
<main id="page"></main>
<dialog class="lightbox" id="lb"><div class="lb-inner"><img id="lbImg" alt=""><div class="lb-cap" id="lbCap"></div></div>
  <button class="lb-close" aria-label="ปิด">×</button><button class="lb-prev" aria-label="ก่อนหน้า">‹</button><button class="lb-next" aria-label="ถัดไป">›</button></dialog>
<script>
(async function(){
const id = new URLSearchParams(location.search).get("id");
const i = P.findIndex(x => x.id === id), p = P[i], page = document.getElementById("page");
document.getElementById("brand").innerHTML = brandHtml();
document.getElementById("nav").innerHTML = navHtml("");
if (!p){ page.innerHTML = `<div class="notfound"><h1>ไม่พบโครงการ</h1><p><a href="index.html">กลับไปหน้าแผนที่</a></p></div>`; return; }
document.title = p.name + " — Landscape Case Atlas";
document.getElementById("crumb").textContent = p.name;

const ims = (p.images || []).slice();
if (!ims.length && p.wikipedia){ const u = await wikiThumb(p.wikipedia); if (u) ims.push({url: u, type: "photo", caption: "ภาพจาก Wikipedia", credit: "Wikimedia Commons"}); }
const order = {plan: 0, diagram: 1, section: 2};
const drawings = ims.filter(isDrawing).sort((a, b) => order[a.type] - order[b.type]);
const photos = ims.filter(im => !isDrawing(im));
const all = [...drawings, ...photos];
const slides = photos.length ? photos : drawings.slice(0, 1);   // hero cycles through photos only
const cap = im => `${isDrawing(im) ? `<span class="ttag">${esc(IMG_TYPE[im.type])}</span>` : ""}${esc(im.caption || "")}${im.year ? ` (${esc(im.year)})` : ""}${im.credit ? ` — © ${esc(im.credit)}` : ""}${im.source ? ` · <a href="${esc(im.source)}" target="_blank" rel="noopener">ที่มา</a>` : ""}`;
const SHOW = 12; // photos visible before "see more" (≈3 rows of the 4-column gallery)
const fig = (im, cls = "") => `<figure${cls ? ` class="${cls}"` : ""}><img src="${esc(im.url)}" alt="${esc(im.caption || p.name)}" loading="lazy" referrerpolicy="no-referrer" data-i="${all.indexOf(im)}" onerror="this.closest('figure').remove()"><figcaption>${cap(im)}</figcaption></figure>`;
const list = (arr, fn) => (arr || []).map(fn).join("");
const prev = P[i - 1], next = P[i + 1];
// previous / next project (wraps around) — shown when the mouse reaches the hero's left / right edge
const prevP = P[(i - 1 + P.length) % P.length], nextP = P[(i + 1) % P.length];
const edge = (q, dir) => P.length < 2 ? "" : `<a class="edge edge--${dir}" href="${projectUrl(q)}" aria-label="${dir === "prev" ? "โครงการก่อนหน้า" : "โครงการถัดไป"}: ${esc(q.name)}">
  <span class="edge-card">${coverImg(q) ? `<img src="${esc(coverImg(q))}" alt="" loading="lazy" referrerpolicy="no-referrer">` : `<span class="ph"></span>`}
    <span><small>${dir === "prev" ? "← โครงการก่อนหน้า" : "โครงการถัดไป →"}</small><b>${esc(q.name)}</b><em>${esc(q.city)}, ${esc(q.country)}</em></span></span></a>`;
// design strategies: under the description, or in the right column when the project has no drawings
const strat = (p.design_strategies || []).length ? `<div class="strat"><h3>กลยุทธ์การออกแบบ</h3><ul>${list(p.design_strategies, s => `<li>${esc(s)}</li>`)}</ul></div>` : "";

page.innerHTML = `
  ${slides.length ? `<div class="hero" id="hero" role="img" aria-label="ภาพโครงการ ${esc(p.name)}">
    ${slides.map((im, k) => `<div class="sl${k ? "" : " on"}" style="background-image:url('${esc(im.url)}')"></div>`).join("")}
    ${slides.length > 1 ? `<button type="button" class="hero-nav hero-nav--prev" id="heroPrev" aria-label="ภาพก่อนหน้า"></button><button type="button" class="hero-nav hero-nav--next" id="heroNext" aria-label="ภาพถัดไป"></button>` : ""}
    ${slides.length > 1 ? `<div class="dots">${slides.map((_, k) => `<button type="button" aria-label="ภาพที่ ${k + 1}" aria-current="${!k}"></button>`).join("")}</div>` : ""}
    ${edge(prevP, "prev")}${edge(nextP, "next")}
    <div class="hcap" id="hcap"></div></div>` : ""}
  <div class="wrap">
    <div class="intro">
    <div class="head">
      <div>${catTags(p)}</div>
      <h1>${esc(p.name)}</h1>
      ${p.name_local ? `<div class="sub">${esc(p.name_local)}</div>` : ""}
      <p class="lead">${esc(p.summary_th)}</p>
      <a class="mapbtn" href="index.html?focus=${encodeURIComponent(p.id)}">ดูบนแผนที่ →</a>
    </div>
    <div class="facts">
      <div><span>ผู้ออกแบบ</span><p>${esc(p.designer)}</p></div>
      <div><span>ที่ตั้ง</span><p>${esc(p.city)}, ${esc(p.country)}</p></div>
      <div><span>ปีที่แล้วเสร็จ</span><p>${esc(p.year || "-")}</p></div>
      <div><span>ขนาดพื้นที่</span><p>${esc(p.area || "-")}</p></div>
      ${p.client ? `<div><span>เจ้าของโครงการ</span><p>${esc(p.client)}</p></div>` : ""}
      ${(p.awards||[]).length ? `<div><span>รางวัล</span><p>${p.awards.map(esc).join("<br>")}</p></div>` : ""}
    </div>
    </div>

    ${photos.length ? `<div class="photos${photos.length > SHOW ? " collapsed" : ""}" id="photos">${photos.map((im, k) => fig(im, k >= SHOW ? "more" : "")).join("")}</div>
      ${photos.length > SHOW ? `<button class="btn morebtn" id="moreBtn" type="button">ดูภาพเพิ่มเติม (+${photos.length - SHOW} ภาพ)</button>` : ""}` : ""}

    <section class="cols${drawings.length ? "" : " nodraw"}">
      <div>
        <h2>รายละเอียดโครงการ</h2>
        <div class="desc">${String(p.description_th || "").split(/\n\s*\n/).map(t => `<p>${esc(t)}</p>`).join("")}</div>
        ${drawings.length ? strat : ""}
        ${(p.tags||[]).length ? `<p class="tags">แท็ก: ${p.tags.map(esc).join(" · ")}</p>` : ""}
        <div class="sub-sec">
          <h2>งานวิจัยที่ศึกษาโครงการนี้</h2>
          ${(p.research||[]).length ? `<ol class="research">${list(p.research, r => `<li>${esc(r.authors || "")} (${esc(r.year || "")}). <a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>${r.journal ? `. <em>${esc(r.journal)}</em>` : ""}${r.note_th ? `<span class="note">${esc(r.note_th)}</span>` : ""}</li>`)}</ol>`
            : `<p class="muted">ยังไม่พบงานวิจัยที่ศึกษาโครงการนี้โดยตรง</p>`}
        </div>
      </div>
      ${drawings.length ? `<div class="drawings">${list(drawings, fig)}</div>` : `<div class="side">${strat}</div>`}
    </section>

    <section>
      <h2>ตำแหน่งที่ตั้ง <small><a href="https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}" target="_blank" rel="noopener">เปิดใน Google Maps</a></small></h2>
      <div id="locmap"></div>
      <div class="mapnote" id="mapnote"></div>
    </section>

    <section class="narrow">
      <h2>แหล่งข้อมูล</h2>
      <ul class="sources">${list(p.sources, s => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title || s.url)}</a></li>`)}</ul>
      <p class="muted" style="font-size:13px">เพิ่มเมื่อ ${esc(p.added_date || p.added_week)}${p.last_reviewed ? ` · ตรวจทานล่าสุด ${esc(p.last_reviewed)}` : ""} · ภาพเป็นลิขสิทธิ์ของเจ้าของตามที่ระบุ</p>
    </section>


    ${(p.updates||[]).length ? `<section class="narrow"><h2>บันทึกการอัปเดต</h2><ul class="updlog">${list(p.updates.slice().reverse(), u => `<li><time>${esc(u.date)}</time>${esc(u.note_th)}</li>`)}</ul></section>` : ""}


    <nav class="nav">
      ${prev ? `<a href="${projectUrl(prev)}">← ${esc(prev.name)}</a>` : "<span></span>"}
      ${next ? `<a href="${projectUrl(next)}" style="text-align:right">${esc(next.name)} →</a>` : "<span></span>"}
    </nav>
  </div>`;

// hero slideshow: crossfade every 3.5 s (paused only while the tab is hidden / reduced motion); left / right half = previous / next
const heroEl = document.getElementById("hero");
if (heroEl){
  const sl = heroEl.querySelectorAll(".sl"), dots = heroEl.querySelectorAll(".dots button"), hcap = document.getElementById("hcap");
  let k = 0, timer = null;
  const go = n => {
    sl[k].classList.remove("on"); k = (n + sl.length) % sl.length;
    sl[k].classList.remove("on"); void sl[k].offsetWidth; sl[k].classList.add("on");   // restart the slow zoom
    dots.forEach((d, j) => d.setAttribute("aria-current", j === k));
    const im = slides[k]; hcap.textContent = [im.caption, im.credit && "© " + im.credit].filter(Boolean).join(" — ");
  };
  const tick = () => { if (!document.hidden) go(k + 1); };   // keeps going even while the mouse is over the photo
  const auto = sl.length > 1 && !matchMedia("(prefers-reduced-motion: reduce)").matches;
  const restart = () => { if (!auto) return; clearInterval(timer); timer = setInterval(tick, 3500); };   // manual step → full 3.5 s on the new photo
  const step = n => { go(n); restart(); };
  go(0); restart();
  heroEl.addEventListener("click", e => {
    e.stopPropagation();   // keep the gallery lightbox handler out of the hero
    const d = e.target.closest(".dots button");
    if (d) return step([...dots].indexOf(d));
    if (e.target.id === "heroPrev") step(k - 1);
    if (e.target.id === "heroNext") step(k + 1);
  });
  // swipe on touch screens
  let x0 = null;
  heroEl.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, {passive: true});
  heroEl.addEventListener("touchend", e => {
    if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 40) step(dx < 0 ? k + 1 : k - 1);
  });
}

// location map — satellite by default so the built site is visible
// project boundary (GeoJSON from OpenStreetMap) when available, otherwise a point
const m = L.map("locmap", {scrollWheelZoom: false});
addBaseLayers(m, "Google Satellite", "lca-base-project");
const note = document.getElementById("mapnote"), b = p.boundary;
let drawn = false;
if (b && b.geometry){
  try {
    const line = /Line/.test(b.geometry.type), c = col(cats(p)[0]);
    const lyr = L.geoJSON(b.geometry, {style: {color: c, weight: line ? 7 : 3, opacity: .95, fillColor: c, fillOpacity: .22}})
      .addTo(m).bindTooltip(p.name, {sticky: true});
    m.fitBounds(lyr.getBounds(), {padding: [28, 28], maxZoom: 18}); drawn = true;
    const src = [].concat(b.source || []);
    note.innerHTML = `${line ? "แนวเส้นของโครงการ" : "ขอบเขตโครงการ"}จาก OpenStreetMap${src.length ? ` (${src.map((u, k) => `<a href="${esc(u)}" target="_blank" rel="noopener">${k ? k + 1 : "ข้อมูล"}</a>`).join(", ")})` : ""} — อาจไม่ตรงกับพื้นที่ออกแบบทุกประการ`;
  } catch(e){ drawn = false; }
}
if (!drawn){
  m.setView([p.lat, p.lng], 16);
  L.marker([p.lat, p.lng], {icon: pinIcon(p)}).addTo(m).bindTooltip(p.name);
  note.textContent = "แสดงเป็นจุดที่ตั้ง — ยังไม่มีข้อมูลขอบเขตโครงการ";
}

// "see more" photos
const moreBtn = document.getElementById("moreBtn");
if (moreBtn) moreBtn.onclick = () => {
  const g = document.getElementById("photos"), open = g.classList.toggle("collapsed");
  moreBtn.textContent = open ? `ดูภาพเพิ่มเติม (+${photos.length - SHOW} ภาพ)` : "ย่อภาพ";
  if (open) g.scrollIntoView({behavior: "smooth", block: "start"});
};

// lightbox across drawings + photos
const lb = document.getElementById("lb"); let cur = 0;
const show = k => { cur = (k + all.length) % all.length; const im = all[cur];
  document.getElementById("lbImg").src = im.url; document.getElementById("lbCap").innerHTML = cap(im); };
page.addEventListener("click", e => { const t = e.target.closest("[data-i]"); if (t && all.length){ show(+t.dataset.i); lb.showModal(); } });
lb.querySelector(".lb-close").onclick = () => lb.close();
lb.querySelector(".lb-prev").onclick = () => show(cur - 1);
lb.querySelector(".lb-next").onclick = () => show(cur + 1);
lb.addEventListener("click", e => { if (e.target.classList.contains("lb-inner")) lb.close(); });
document.addEventListener("keydown", e => { if (!lb.open) return; if (e.key === "ArrowLeft") show(cur - 1); if (e.key === "ArrowRight") show(cur + 1); });
})();
</script>
</body>
</html>
